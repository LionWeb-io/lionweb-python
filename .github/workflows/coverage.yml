name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OVERALL_COVERAGE_FAIL_UNDER: "60"
      DIFF_COVER_FAIL_UNDER: "50"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for diff-cover to compare against main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" ruff==0.9.6 mypy==1.15.0 mypy-protobuf==3.6.0 types-requests

      - name: Prepare for tests
        run: make test-setup

      - name: Run unit tests with coverage
        run: make coverage COVERAGE_ARGS="--fail-under=${OVERALL_COVERAGE_FAIL_UNDER}"

      - name: Generate coverage XML
        run: coverage xml -o coverage.xml

      - name: Diff coverage for PR changes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin main:refs/remotes/origin/main

          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under="${DIFF_COVER_FAIL_UNDER}" \
            --html-report diffcov.html > diffcov.txt || RC=$?

          {
            echo "## Diff Coverage Summary"
            echo ""
            echo "\`diff-cover --fail-under=${DIFF_COVER_FAIL_UNDER}\` against origin/main"
            echo ""
            echo '```'
            cat diffcov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit ${RC:-0}

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            diffcov.html
            coverage.xml
          if-no-files-found: ignore
